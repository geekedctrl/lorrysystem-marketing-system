services:
  backend-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketing_rebuild
      POSTGRES_USER: marketing_rebuild
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?Set BACKEND_DB_PASSWORD}
    volumes:
      - backend-rebuild-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketing_rebuild -d marketing_rebuild"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend-migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://marketing_rebuild:${BACKEND_DB_PASSWORD}@backend-db:5432/marketing_rebuild
      API_DB_PASSWORD: ${BACKEND_API_DB_PASSWORD:?Set BACKEND_API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${BACKEND_WORKER_DB_PASSWORD:?Set BACKEND_WORKER_DB_PASSWORD}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      backend-db: {condition: service_healthy}
  backend-api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backend_api:${BACKEND_API_DB_PASSWORD}@backend-db:5432/marketing_rebuild
      SENDER_CREDENTIAL_ENCRYPTION_KEY: ${SENDER_CREDENTIAL_ENCRYPTION_KEY:-}
    ports: ["127.0.0.1:${NATIVE_API_HOST_PORT:-8020}:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend-migrate: {condition: service_completed_successfully}
  backend-worker:
    build:
      context: ./backend
      args:
        INSTALL_DISCOVERY_BROWSER: ${BACKEND_DISCOVERY_BROWSER_FALLBACK:-false}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://backend_worker:${BACKEND_WORKER_DB_PASSWORD}@backend-db:5432/marketing_rebuild
      DISCOVERY_BROWSER_FALLBACK: ${BACKEND_DISCOVERY_BROWSER_FALLBACK:-false}
      MODEL_BASE_URL: ${BACKEND_MODEL_BASE_URL:-https://api.xkiro.com/v1}
      MODEL_NAME: ${BACKEND_MODEL_NAME:-mistralai/mistral-large-2512}
      MODEL_AUTH_HEADER: ${BACKEND_MODEL_AUTH_HEADER:-Authorization}
      MODEL_API_KEY: ${BACKEND_MODEL_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BACKEND_BRAVE_SEARCH_API_KEY:-}
      MODEL_INPUT_USD_PER_MILLION: ${BACKEND_MODEL_INPUT_USD_PER_MILLION:-}
      MODEL_OUTPUT_USD_PER_MILLION: ${BACKEND_MODEL_OUTPUT_USD_PER_MILLION:-}
      SEARCH_USD_PER_REQUEST: ${BACKEND_SEARCH_USD_PER_REQUEST:-}
      PROVIDER_MONTHLY_BUDGET_USD: ${BACKEND_PROVIDER_MONTHLY_BUDGET_USD:-50}
      SENDER_CREDENTIAL_ENCRYPTION_KEY: ${SENDER_CREDENTIAL_ENCRYPTION_KEY:-}
    command: ["python", "-m", "marketing_backend.worker"]
    depends_on:
      backend-migrate: {condition: service_completed_successfully}
  dashboard-dev:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.native
    restart: unless-stopped
    environment:
      NATIVE_API_BASE_URL: http://backend-api:8000
      DASHBOARD_SECURE_COOKIES: ${NATIVE_DASHBOARD_SECURE_COOKIES:-true}
    ports: ["127.0.0.1:8081:8080"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      backend-api: {condition: service_healthy}
      backend-worker: {condition: service_started}
  backend-smoke:
    build: ./backend
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://marketing_rebuild:${BACKEND_DB_PASSWORD}@backend-db:5432/marketing_rebuild
      APP_ENV: local-smoke
    command: ["python", "-m", "tests.runtime_smoke"]
    depends_on:
      backend-api: {condition: service_started}
      backend-worker: {condition: service_started}
  backend-test:
    build: ./backend
    profiles: [test]
    environment:
      DATABASE_URL: postgresql+psycopg://marketing_rebuild:${BACKEND_DB_PASSWORD}@backend-db:5432/marketing_rebuild_test
      API_DB_PASSWORD: ${BACKEND_API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${BACKEND_WORKER_DB_PASSWORD}
      APP_ENV: test
      SENDER_CREDENTIAL_ENCRYPTION_KEY: ${SENDER_CREDENTIAL_ENCRYPTION_KEY:-}
    command: ["sh", "-c", "alembic upgrade head && python -m unittest discover -s tests -v"]
    depends_on:
      backend-db: {condition: service_healthy}
volumes:
  backend-rebuild-data:
