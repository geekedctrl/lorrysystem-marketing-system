name: Backend Rebuild CI
on:
  pull_request:
    paths: ['backend/**', 'compose.backend.yml', 'compose.native-integration.yml', 'docs/contracts/native-backend-openapi.json', '.github/workflows/backend-rebuild-ci.yml']
  push:
    branches: ['rebuild/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated test configuration
        run: |
          python3 - <<'PY'
          import secrets
          from pathlib import Path
          Path('.env.backend-ci').write_text(''.join(name+'='+secrets.token_hex(24)+'\n' for name in ['BACKEND_DB_PASSWORD','BACKEND_API_DB_PASSWORD','BACKEND_WORKER_DB_PASSWORD']))
          PY
      - name: Build backend and start isolated database
        run: |
          docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml up -d --wait backend-db
          docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml exec -T backend-db createdb -U marketing_rebuild marketing_rebuild_test
          docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml --profile test build
      - name: Test PostgreSQL isolation and durable jobs
        run: docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml --profile test run --rm backend-test
      - name: Start restricted API and native worker
        run: |
          docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml up -d backend-api backend-worker
          python3 - <<'PY'
          import time,urllib.request
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8020/health',timeout=2) as response:
                      assert response.status==200
                  break
              except Exception:
                  if attempt==29: raise
                  time.sleep(1)
          PY
      - name: Test running API and worker roles
        run: docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml --profile test run --rm backend-smoke
      - name: Verify exported native API contract
        run: |
          docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml exec -T backend-api python -c "import json; from marketing_backend.api import app; print(json.dumps(app.openapi()))" > native-openapi.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('native-openapi.json').read_text()) == json.loads(Path('docs/contracts/native-backend-openapi.json').read_text()), 'Refresh the native OpenAPI snapshot'
          PY
      - name: Stop isolated test containers
        if: always()
        run: docker compose --env-file .env.backend-ci -p backend-rebuild-ci -f compose.backend.yml --profile test down
