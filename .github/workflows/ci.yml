name: LorrySystem CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "rebuild/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-worker-test:
    name: Native discovery + workers + PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketing_rebuild_test
          POSTGRES_USER: native_test
          POSTGRES_PASSWORD: native-ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U native_test -d marketing_rebuild_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://native_test:native-ci-disposable-password@localhost:5432/marketing_rebuild_test
      API_DB_PASSWORD: native-ci-disposable-api-password
      WORKER_DB_PASSWORD: native-ci-disposable-worker-password
      DISCOVERY_BROWSER_TEST: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install locked backend and isolated browser
        run: |
          python -m pip install -r backend/requirements.lock
          python -m playwright install --with-deps chromium
      - name: Migrate and test native discovery and preparation
        working-directory: backend
        run: |
          alembic upgrade head
          python -m unittest discover -s tests -v

  integration-test:
    name: API + Database + Dashboard
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Python syntax
        run: |
          python3 -m compileall -q api/app
          python3 -m compileall -q dashboard/app

      - name: Test research brief presentation
        run: python3 dashboard/scripts/validate_research_presentation.py

      - name: Test campaign proposal dashboard
        run: |
          python3 -m pip install -r dashboard/requirements.txt
          python3 dashboard/scripts/validate_campaign_proposals.py
          python3 dashboard/scripts/validate_login_sessions.py

      - name: Test native frontend and synthetic browser journey
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 dashboard/scripts/validate_native_frontend.py --browser
          node --check dashboard/app/static/native.js

      - name: Test dashboard UX state summaries
        run: |
          python3 dashboard/scripts/validate_ux_states.py
          node --check dashboard/app/static/ui.js
          node --check dashboard/app/static/theme.js

      - name: Test n8n workspace adaptation
        run: node --test integrations/n8n/workspace-runtime.test.js integrations/n8n/discovery.test.js integrations/n8n/research.test.js integrations/n8n/people.test.js integrations/n8n/pipeline.test.js integrations/n8n/shared.test.js integrations/n8n/usage.test.js

      - name: Create disposable CI environment
        shell: bash
        run: |
          set -euo pipefail

          PG_PASSWORD="$(openssl rand -hex 32)"
          API_KEY="$(openssl rand -hex 32)"
          DASHBOARD_SECRET="$(openssl rand -hex 32)"
          BACKEND_DB_PASSWORD="$(openssl rand -hex 32)"
          BACKEND_API_DB_PASSWORD="$(openssl rand -hex 32)"
          BACKEND_WORKER_DB_PASSWORD="$(openssl rand -hex 32)"

          cat > .env <<EOF
          APP_ENV=ci

          POSTGRES_HOST=postgres-dev
          POSTGRES_PORT=5432
          POSTGRES_DB=lorrysystem_dev
          POSTGRES_USER=lorrysystem_dev
          POSTGRES_PASSWORD=${PG_PASSWORD}

          MARKETING_API_KEY=${API_KEY}

          BACKEND_DB_PASSWORD=${BACKEND_DB_PASSWORD}
          BACKEND_API_DB_PASSWORD=${BACKEND_API_DB_PASSWORD}
          BACKEND_WORKER_DB_PASSWORD=${BACKEND_WORKER_DB_PASSWORD}
          OWNERSHIP_PREFLIGHT_TOKEN=ci-synthetic-ownership-token
          BACKEND_PROVIDER_MONTHLY_BUDGET_USD=50
          NATIVE_DASHBOARD_SECURE_COOKIES=false
          NATIVE_API_HOST_PORT=8020
          EOF

          cat > dashboard/.env <<EOF
          MARKETING_API_BASE_URL=http://lorrysystem-dev-marketing-api:8000
          MARKETING_API_KEY=${API_KEY}

          DASHBOARD_SESSION_SECRET=${DASHBOARD_SECRET}
          DASHBOARD_REVIEWER_IDENTITY=ci-reviewer
          TRUST_CLOUDFLARE_IDENTITY=false

          ICP_LOGISTICS_HAULAGE_ID=00000000-0000-0000-0000-000000000001
          ICP_PASSENGER_TRANSPORT_ID=00000000-0000-0000-0000-000000000002
          ICP_COMMERCIAL_ENTERPRISE_ID=00000000-0000-0000-0000-000000000003
          EOF

      - name: Validate Docker Compose
        run: |
          docker compose config -q
          echo "Docker Compose configuration is valid."

      - name: Build legacy and native API and Dashboard images
        run: |
          docker compose build marketing-api-dev dashboard-dev dashboard-legacy-dev backend-api backend-worker

      - name: Start PostgreSQL and API
        run: |
          docker compose up -d postgres-dev marketing-api-dev
          docker compose ps

      - name: Wait for PostgreSQL health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' lorrysystem-dev-postgres 2>/dev/null || true)"

            if [ "${STATUS}" = "healthy" ]; then
              echo "PostgreSQL is healthy."
              exit 0
            fi

            echo "Waiting for PostgreSQL... (${attempt}/30) status=${STATUS:-unknown}"
            sleep 2
          done

          echo "PostgreSQL did not become healthy."
          exit 1

      - name: Apply Alembic migrations
        run: |
          docker exec lorrysystem-dev-marketing-api \
            alembic upgrade head

      - name: Verify Alembic migration state
        shell: bash
        run: |
          set -euo pipefail

          HEAD_REVISION="$(
            docker exec lorrysystem-dev-marketing-api \
              alembic heads |
            awk 'NR == 1 {print $1}'
          )"

          CURRENT_REVISION="$(
            docker exec lorrysystem-dev-marketing-api \
              alembic current 2>/dev/null |
            awk '/\(head\)/ {print $1}' |
            tail -1
          )"

          echo "Alembic head:     ${HEAD_REVISION}"
          echo "Database current: ${CURRENT_REVISION}"

          if [ -z "${HEAD_REVISION}" ] || [ -z "${CURRENT_REVISION}" ]; then
            echo "Could not determine Alembic migration state."
            exit 1
          fi

          if [ "${HEAD_REVISION}" != "${CURRENT_REVISION}" ]; then
            echo "Database is not at Alembic HEAD."
            exit 1
          fi

      - name: Wait for API health
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8001/health >/dev/null; then
              echo "Marketing API is healthy."
              exit 0
            fi

            echo "Waiting for API... (${attempt}/30)"
            sleep 2
          done

          echo "Marketing API did not become healthy."
          exit 1

      - name: Test API authentication
        shell: bash
        run: |
          set -euo pipefail

          API_KEY="$(
            grep '^MARKETING_API_KEY=' .env |
            cut -d= -f2-
          )"

          STATUS="$(
            curl -s \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8001/api/companies
          )"

          echo "Request without API key returned HTTP ${STATUS}"

          if [ "${STATUS}" != "401" ]; then
            echo "Protected API endpoint did not reject unauthenticated request."
            exit 1
          fi

          curl -fsS \
            -H "X-API-Key: ${API_KEY}" \
            http://127.0.0.1:8001/api/companies \
            >/dev/null

          echo "Authenticated API request succeeded."

      - name: Count API endpoints
        run: |
          curl -fsS \
            http://127.0.0.1:8001/openapi.json \
            -o /tmp/openapi.json

          python3 - <<'PY'
          import json

          with open("/tmp/openapi.json", encoding="utf-8") as f:
              spec = json.load(f)

          supported = {
              "GET",
              "POST",
              "PUT",
              "PATCH",
              "DELETE",
              "OPTIONS",
              "HEAD",
          }

          counts = {}

          for path_data in spec.get("paths", {}).values():
              for method in path_data:
                  method = method.upper()
                  if method in supported:
                      counts[method] = counts.get(method, 0) + 1

          print("API endpoint count:")
          for method in sorted(counts):
              print(f"  {method}: {counts[method]}")
          print(f"  TOTAL: {sum(counts.values())}")
          PY

      - name: Configure Dashboard ICP IDs
        shell: bash
        run: |
          set -euo pipefail

          COMMERCIAL_ID="$(
            docker exec lorrysystem-dev-postgres \
              psql \
              -U lorrysystem_dev \
              -d lorrysystem_dev \
              -tAc \
              "SELECT id FROM icp_profiles WHERE code='COMMERCIAL_ENTERPRISE';" |
            tr -d '[:space:]'
          )"

          LOGISTICS_ID="$(
            docker exec lorrysystem-dev-postgres \
              psql \
              -U lorrysystem_dev \
              -d lorrysystem_dev \
              -tAc \
              "SELECT id FROM icp_profiles WHERE code='LOGISTICS_HAULAGE';" |
            tr -d '[:space:]'
          )"

          PASSENGER_ID="$(
            docker exec lorrysystem-dev-postgres \
              psql \
              -U lorrysystem_dev \
              -d lorrysystem_dev \
              -tAc \
              "SELECT id FROM icp_profiles WHERE code='PASSENGER_TRANSPORT';" |
            tr -d '[:space:]'
          )"

          if [ -z "${COMMERCIAL_ID}" ] || \
             [ -z "${LOGISTICS_ID}" ] || \
             [ -z "${PASSENGER_ID}" ]; then
            echo "One or more ICP profiles were not seeded."
            exit 1
          fi

          API_KEY="$(
            grep '^MARKETING_API_KEY=' .env |
            cut -d= -f2-
          )"

          DASHBOARD_SECRET="$(
            grep '^DASHBOARD_SESSION_SECRET=' dashboard/.env |
            cut -d= -f2-
          )"

          cat > dashboard/.env <<EOF
          MARKETING_API_BASE_URL=http://lorrysystem-dev-marketing-api:8000
          MARKETING_API_KEY=${API_KEY}

          DASHBOARD_SESSION_SECRET=${DASHBOARD_SECRET}
          DASHBOARD_REVIEWER_IDENTITY=ci-reviewer
          TRUST_CLOUDFLARE_IDENTITY=false

          ICP_LOGISTICS_HAULAGE_ID=${LOGISTICS_ID}
          ICP_PASSENGER_TRANSPORT_ID=${PASSENGER_ID}
          ICP_COMMERCIAL_ENTERPRISE_ID=${COMMERCIAL_ID}
          EOF

          echo "Dashboard configured with CI ICP profiles."

      - name: Start Dashboard
        run: |
          docker compose up -d dashboard-dev dashboard-legacy-dev
          docker compose ps

      - name: Test Dashboard
        shell: bash
        run: |
          set -euo pipefail

          READY=0

          for attempt in {1..30}; do
            STATUS="$(
              curl -s \
                -o /dev/null \
                -w '%{http_code}' \
                http://127.0.0.1:8081/ \
                || true
            )"

            if [ "${STATUS}" = "302" ]; then
              echo "Dashboard root returned expected HTTP 302."
              READY=1
              break
            fi

            echo "Waiting for Dashboard... (${attempt}/30), HTTP=${STATUS:-none}"
            sleep 2
          done

          if [ "${READY}" != "1" ]; then
            echo "Dashboard did not become ready."
            exit 1
          fi

          curl -fsS \
            http://127.0.0.1:8081/dashboard \
            >/dev/null

          echo "Dashboard page loaded successfully."

      - name: Start native API, worker and dashboard alongside legacy DEV
        run: |
          docker compose up -d backend-api backend-worker dashboard-dev
          docker compose ps backend-db backend-api backend-worker dashboard-dev

      - name: Verify native API and dashboard health
        shell: bash
        run: |
          set -euo pipefail

          for url in http://127.0.0.1:8020/health http://127.0.0.1:8081/health; do
            READY=0
            for attempt in {1..45}; do
              STATUS="$(curl -s -o /dev/null -w '%{http_code}' "${url}" || true)"
              if [ "${STATUS}" = "200" ]; then
                echo "${url} returned HTTP 200."
                READY=1
                break
              fi
              sleep 2
            done
            if [ "${READY}" != "1" ]; then
              echo "${url} did not become healthy (HTTP ${STATUS:-none})."
              exit 1
            fi
          done

      - name: Test workspace isolation, roles and browser sessions
        run: |
          docker exec \
            -e APP_ENV=ci \
            -e EXPORT_TEST_LOGIN=true \
            -e DASHBOARD_BASE_URL=http://dashboard-legacy-dev:8080 \
            lorrysystem-dev-marketing-api \
            python scripts/validate_workspaces.py

      - name: Test business-card OCR and CSV import regression
        run: |
          docker cp lorrysystem-dev-marketing-api:/tmp/workspace-validation-account.json /tmp/workspace-validation-account.json
          docker exec -i lorrysystem-dev-dashboard-legacy python -c \
            "import json,os,runpy,sys; account=json.load(sys.stdin); os.environ['DASHBOARD_TEST_EMAIL']=account['email']; os.environ['DASHBOARD_TEST_PASSWORD']=account['password']; runpy.run_path('scripts/validate_lead_imports.py',run_name='__main__')" \
            < /tmp/workspace-validation-account.json
          rm -f /tmp/workspace-validation-account.json

      - name: Test dashboard discovery runs and workspace boundaries
        run: |
          docker exec -e APP_ENV=ci -e DASHBOARD_BASE_URL=http://dashboard-legacy-dev:8080 \
            lorrysystem-dev-marketing-api python scripts/validate_discovery_runs.py

      - name: Test workspace migration and guarded rollback
        run: |
          docker exec \
            -e APP_ENV=ci \
            lorrysystem-dev-marketing-api \
            python scripts/validate_workspace_migration.py

      - name: Test workspace research queue and dashboard
        run: |
          docker exec -e APP_ENV=ci -e DASHBOARD_BASE_URL=http://dashboard-legacy-dev:8080 \
            lorrysystem-dev-marketing-api python scripts/validate_workspace_research.py

      - name: Test reviewed contact, scoring, matching, drafts and approval pipeline
        run: |
          docker exec -e APP_ENV=ci -e DASHBOARD_BASE_URL=http://dashboard-legacy-dev:8080 \
            lorrysystem-dev-marketing-api python scripts/validate_lead_pipeline.py

      - name: Test mock campaign strategy, tenancy and human review
        run: |
          docker exec -e APP_ENV=ci lorrysystem-dev-marketing-api python scripts/test_campaign_strategist.py
          docker exec -e APP_ENV=ci lorrysystem-dev-marketing-api python scripts/validate_campaign_strategist.py
          docker exec -e APP_ENV=ci -e DASHBOARD_BASE_URL=http://dashboard-legacy-dev:8080 \
            lorrysystem-dev-marketing-api python scripts/validate_campaign_http.py

      - name: Test shared product onboarding and automatic preparation
        run: |
          docker exec -e APP_ENV=ci \
            lorrysystem-dev-marketing-api python scripts/validate_product_automation.py

      - name: Test Dashboard to API connectivity
        run: |
          docker exec -e APP_ENV=ci lorrysystem-dev-marketing-api python scripts/validate_preparation_quality.py
          docker exec -e APP_ENV=ci lorrysystem-dev-marketing-api python scripts/validate_smtp_sending.py

      - name: Verify Dashboard to API connectivity
        run: |
          docker exec lorrysystem-dev-dashboard-legacy \
            python -c \
            "import httpx; r=httpx.get('http://lorrysystem-dev-marketing-api:8000/health'); r.raise_for_status(); print(r.status_code, r.text)"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          echo "=== CONTAINERS ==="
          docker compose ps -a

          echo
          echo "=== API LOGS ==="
          docker logs --tail 200 lorrysystem-dev-marketing-api || true

          echo
          echo "=== NATIVE DASHBOARD LOGS ==="
          docker compose logs --tail 200 dashboard-dev || true

          echo "=== LEGACY DASHBOARD LOGS ==="
          docker logs --tail 200 lorrysystem-dev-dashboard-legacy || true

          echo
          echo "=== POSTGRES LOGS ==="
          docker logs --tail 200 lorrysystem-dev-postgres || true

      - name: Clean up CI containers
        if: always()
        run: |
          docker compose down -v --remove-orphans || true
