# Disposable acceptance only. The frontend source is mounted read-only from its owner's checkout.
services:
  native-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketing_native_acceptance
      POSTGRES_USER: native_acceptance
      POSTGRES_PASSWORD: ${NATIVE_DB_PASSWORD:?Generate the ignored acceptance configuration}
    volumes: [native-acceptance-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U native_acceptance -d marketing_native_acceptance']
      interval: 2s
      timeout: 3s
      retries: 30
  native-migrate:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://native_acceptance:${NATIVE_DB_PASSWORD}@native-db:5432/marketing_native_acceptance
      API_DB_PASSWORD: ${NATIVE_API_DB_PASSWORD:?Set NATIVE_API_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${NATIVE_WORKER_DB_PASSWORD:?Set NATIVE_WORKER_DB_PASSWORD}
    command: [alembic, upgrade, head]
    depends_on:
      native-db: {condition: service_healthy}
  native-bootstrap:
    build: ./backend
    user: '0:0'
    environment:
      DATABASE_URL: postgresql+psycopg://native_acceptance:${NATIVE_DB_PASSWORD}@native-db:5432/marketing_native_acceptance
      APP_ENV: native-acceptance
    command: [python, -m, tests.native_acceptance, bootstrap]
    volumes: [native-acceptance-fixtures:/fixtures]
    depends_on:
      native-migrate: {condition: service_completed_successfully}
  backend-api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://backend_api:${NATIVE_API_DB_PASSWORD}@native-db:5432/marketing_native_acceptance
    depends_on:
      native-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
  native-worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://backend_worker:${NATIVE_WORKER_DB_PASSWORD}@native-db:5432/marketing_native_acceptance
      APP_ENV: native-acceptance
    command: [python, -m, tests.native_acceptance, worker]
    depends_on:
      backend-api: {condition: service_healthy}
  native-frontend:
    build:
      context: ${NATIVE_FRONTEND_PATH:?Set the frontend owner checkout path}
      dockerfile_inline: |
        FROM python:3.13-slim
        WORKDIR /frontend
        COPY dashboard/requirements.txt ./requirements.txt
        RUN pip install --no-cache-dir -r requirements.txt
        RUN useradd --create-home frontend
        USER frontend
    working_dir: /frontend
    command: [python, -m, uvicorn, app.native:app, --host, 0.0.0.0, --port, '8080']
    environment:
      NATIVE_API_BASE_URL: http://backend-api:8000
      DASHBOARD_SECURE_COOKIES: 'false'
    volumes: ['${NATIVE_FRONTEND_PATH}/dashboard:/frontend:ro']
    ports: ['127.0.0.1:${NATIVE_FRONTEND_PORT:-8094}:8080']
    depends_on:
      backend-api: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 3s
      timeout: 5s
      retries: 30
  native-check:
    build: ./backend
    profiles: [test]
    environment:
      APP_ENV: native-acceptance
      NATIVE_API_URL: http://backend-api:8000
      NATIVE_FRONTEND_URL: http://native-frontend:8080
    command: [python, -m, tests.native_acceptance_check]
    volumes: [native-acceptance-fixtures:/fixtures]
    depends_on:
      native-frontend: {condition: service_healthy}
      native-worker: {condition: service_started}
volumes:
  native-acceptance-data:
  native-acceptance-fixtures:
