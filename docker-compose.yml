name: marketing-system

include:
  # Run the replacement native API, worker, database and dashboard alongside
  # the legacy DEV app until native discovery passes its cutover checks.
  - path: compose.backend.yml

services:

  postgres-dev:
    image: postgres:17-alpine
    container_name: marketing-system-dev-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - marketing-system-dev-db-net

    mem_limit: 384m
    cpus: 0.50


  dev-marketing-api:
    build:
      context: ./api

    container_name: marketing-system-dev-marketing-api
    restart: unless-stopped

    environment:
      APP_ENV: ${APP_ENV:-development}
      DISCOVERY_WEBHOOK_ALLOWED_HOSTS: ${DISCOVERY_WEBHOOK_ALLOWED_HOSTS:-n8n-dev.obsidian.cam}

      POSTGRES_HOST: postgres-dev
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY}
      MARKETING_WORKSPACE_API_KEY: ${MARKETING_WORKSPACE_API_KEY}
      MARKETING_API_KEY: ${MARKETING_API_KEY}
      ENABLE_LEGACY_API_KEY: ${ENABLE_LEGACY_API_KEY:-true}
      SMTP_CREDENTIAL_ENCRYPTION_KEY: ${SMTP_CREDENTIAL_ENCRYPTION_KEY}
      OWNERSHIP_AUTHORITY_URL: http://backend-api:8000
      OWNERSHIP_PREFLIGHT_TOKEN: ${OWNERSHIP_PREFLIGHT_TOKEN:-}

    depends_on:
      postgres-dev:
        condition: service_healthy

    volumes:
      - ./database/migrations/versions:/app/alembic/versions

    ports:
      - "127.0.0.1:8001:8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - marketing-system-dev-db-net
      - marketing-system-dev-api-net
      - default

    mem_limit: 384m
    cpus: 0.75



  dashboard-legacy-dev:
    build:
      context: ./dashboard
    container_name: marketing-system-dev-dashboard-legacy
    restart: unless-stopped

    environment:
      MARKETING_API_BASE_URL: ${MARKETING_API_BASE_URL:-http://dev-marketing-api:8000}
      MARKETING_API_KEY: ${MARKETING_API_KEY}
      DASHBOARD_SESSION_SECRET: ${DASHBOARD_SESSION_SECRET}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      DASHBOARD_REVIEWER_IDENTITY: ${DASHBOARD_REVIEWER_IDENTITY:-}
      TRUST_CLOUDFLARE_IDENTITY: ${TRUST_CLOUDFLARE_IDENTITY:-false}
      ICP_LOGISTICS_HAULAGE_ID: ${ICP_LOGISTICS_HAULAGE_ID:-}
      ICP_PASSENGER_TRANSPORT_ID: ${ICP_PASSENGER_TRANSPORT_ID:-}
      ICP_COMMERCIAL_ENTERPRISE_ID: ${ICP_COMMERCIAL_ENTERPRISE_ID:-}
      DASHBOARD_SECURE_COOKIES: ${DASHBOARD_SECURE_COOKIES:-false}

    depends_on:
      dev-marketing-api:
        condition: service_healthy

    ports:
      - "127.0.0.1:8082:8080"

    networks:
      - marketing-system-dev-api-net

    mem_limit: 384m
    cpus: 0.50

networks:

  marketing-system-dev-db-net:
    name: marketing-system-dev-db-net
    internal: true

  marketing-system-dev-api-net:
    name: marketing-system-dev-api-net
